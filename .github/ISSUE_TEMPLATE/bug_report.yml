name: 🐛 Bug Report
description: Report a bug or unexpected behavior
type: Bug
labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        > [!IMPORTANT]
        > **V4 is no longer maintained.** It depends on `eufy-security-client`, which its own maintainer has
        > deprecated, and eufy has since moved its apps to a new protocol. No further fixes will be made to
        > 4.x — a V4 report cannot be actioned, whatever it turns out to be.
        >
        > If something is broken on V4, please update to V5 and report from there:
        >
        > ```bash
        > npm install -g @homebridge-plugins/homebridge-eufy-security@beta
        > ```
        >
        > V5 needs **Homebridge 2** and **Node 24.5+**, and it registers its own accessories rather than
        > adopting the V4 ones, so expect to reassign rooms, names and automations once. If you cannot move
        > yet, you are welcome to file anyway for the record — just know it waits for V5.

  - type: checkboxes
    id: preflight
    attributes:
      label: Checks you have done (tick only what is true)
      options:
        - label: I have searched the [existing issues](https://github.com/homebridge-plugins/homebridge-eufy/issues) and this bug has not been reported before.
          required: false
        - label: I understand **V4 is no longer maintained**, and that a fix will only ever land in V5.
          required: false
        - label: I am using a **dedicated guest admin account** (not my main Eufy account).
          required: false
        - label: I have restarted Homebridge and the issue persists.
          required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: "The diagnostics archive carries these too, but fill them in so triage can start without opening it."
      value: |
        - **Plugin Version**: 
        - **Homebridge Version**: 
        - **Node.js Version**: 
        - **OS**: 
        - **Support Case ID** (shown when the archive is created): 
      render: markdown
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which area is affected?
      options:
        - Installation / Setup
        - Login / Authentication
        - Livestream / Streaming
        - Motion / Doorbell / Sensor events
        - Snapshots
        - Recording
        - Talkback
        - Security Modes
        - Device Discovery
        - Device controls
        - HomeKit Integration
        - Plugin UI / Dashboard
        - Diagnostics
        - Other
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics Archive
      description: "In the plugin settings, click the Diagnostics (bug) icon on the dashboard and finish a capture. Then find the `homebridge-eufy-support-....eufysupport.gz` file in your Downloads folder, drag it into this box, and wait until its name appears before submitting. The file is encrypted; the plugin never uploads it."
      placeholder: "Drag the .eufysupport.gz file here. Typing text instead leaves the report on hold."
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug, what you expected, and how to reproduce it. Attach logs or screenshots if possible.
      placeholder: |
        **What happened:**
        Describe the issue...

        **What I expected:**
        ...

        **Steps to reproduce:**
        1. ...
        2. ...
    validations:
      required: true
